<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Lab1 Var3</title>
    <script>
        let currentViewIndex = 0;
        function change(){
        
        const myObject = document.getElementById('myObject');
        const views = ['view1', 'view2', 'view3', 'view4', 'view5']; 
        currentViewIndex = (currentViewIndex + 1) % views.length;
        myObject.setAttribute("class", views[currentViewIndex]);
    }
    </script>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d3d3d8;
            height: 300px;
        }

        .view1 {
            width: 100px;
            height: 100px;
            background-color: green;
            border: black;
            border-style: dashed;
        }

        .view2 {
            width: 100px;
            height: 100px;
            background-color: rgb(147, 16, 16);
            border: black;
            border-style: dashed;
        }

        .view3 {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: green;
        }

        .view4 {
            width: 100px;
            height: 100px;
            background-color: green;
            border: pink;
            border-style:solid;
            border-width: 5px;
        }

        .view5 {
            width: 140px;
            height: 140px;
            background-color: green;
            rotate: 45deg;
        }
    </style>
  </head>
  <body>
    <div id="myObject" class="view1" onclick="change()"></div>
  </body>
</html>
